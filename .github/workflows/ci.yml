name: CI

# Каждый пуш в main: сайт (сборка, типы) и API (сборка, тесты на PostgreSQL).
# Если оба прошли — коммит переносится в ветку production, откуда его забирает сервер (deploy/install-autodeploy.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Сайт
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Скрипты выкладки
        run: for f in deploy/*.sh; do bash -n "$f"; done

      - name: Зависимости
        run: npm install --no-audit --no-fund

      # Сборка идёт первой: она создаёт next-env.d.ts, без которого проверка типов не знает про CSS-модули.
      - name: Сборка
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Проверка типов
        run: npm run typecheck

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efirelle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/efirelle_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Сборка
        run: npm run build

      - name: Тесты
        run: npm test

  deploy:
    name: Выкладка
    needs: [web, api]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Перенос в production
        run: git push --force origin HEAD:refs/heads/production

      # Сервер сразу забирает новую версию. Если сигнал не дошёл — подхватит по таймеру за 15 секунд.
      - name: Сигнал серверу
        run: curl -fsS -m 15 -X POST https://efirelle.ru/_deploy-hook || echo "::warning::Сервер не ответил на сигнал — выкладка пройдёт по таймеру"

      # Ждём, пока сервер соберёт этот коммит, и проверяем, что все службы работают.
      - name: Проверка выкладки
        run: |
          report=""
          for _ in $(seq 60); do
            report=$(curl -fsS -m 10 http://87.228.24.55/efirelle-provision.txt 2>/dev/null || true)
            grep -q "Коммит: $GITHUB_SHA" <<<"$report" && break
            sleep 10
          done
          echo "$report"
          grep -q "Коммит: $GITHUB_SHA" <<<"$report" || { echo "::error::Сервер не выложил $GITHUB_SHA за 10 минут"; exit 1; }
          if grep -E "ОШИБКА|: (failed|inactive)$" <<<"$report"; then
            echo "::error::После выкладки есть ошибки — см. отчёт выше"
            exit 1
          fi
